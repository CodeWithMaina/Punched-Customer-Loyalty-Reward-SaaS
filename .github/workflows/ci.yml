name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build PunchedApi -v q
      - name: Test
        run: dotnet test PunchedApi.Tests --nologo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: punched-pwd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
